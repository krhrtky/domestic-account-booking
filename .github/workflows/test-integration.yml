name: Integration Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_call:

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
  NEXTAUTH_SECRET: test-secret-for-ci-integration
  NEXTAUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create pgcrypto extension (for gen_random_uuid)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d test_db -c "CREATE EXTENSION IF NOT EXISTS \"pgcrypto\";"

      - name: Apply database migrations (L-OC-002)
        run: npx drizzle-kit push --verbose
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Verify database schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d test_db -c "\dt"

      - name: Create .env.local for tests
        run: |
          echo "DATABASE_URL=${{ env.DATABASE_URL }}" > .env.local
          echo "NEXTAUTH_SECRET=${{ env.NEXTAUTH_SECRET }}" >> .env.local
          echo "NEXTAUTH_URL=${{ env.NEXTAUTH_URL }}" >> .env.local
          echo "NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}" >> .env.local

      - name: Run integration tests (L-AS-001, L-AS-002, L-BR-006)
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-reports
          path: |
            test-results/
            coverage/
          retention-days: 30

      - name: Summary
        if: success()
        run: |
          echo "✅ Integration Tests Passed"
          echo ""
          echo "Validated Laws:"
          echo "- L-AS-001: API response format"
          echo "- L-AS-002: Input validation"
          echo "- L-BR-001: Settlement calculation in API layer"
          echo "- L-BR-006: CSV import rules"
          echo "- L-TA-001: Evaluation dataset categories"
          echo "- L-TA-005: Dataset requirements verification"
