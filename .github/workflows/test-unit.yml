name: Unit Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_call:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: []

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage (L-TA-002)
        run: npm test -- --run --coverage

      - name: Validate coverage thresholds
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(node -p "JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json', 'utf8')).total.lines.pct")
            echo "Overall coverage: ${COVERAGE}%"
            if (( $(echo "$COVERAGE < 80" | bc -l) )); then
              echo "❌ Coverage ${COVERAGE}% is below 80% threshold (L-TA-002)"
              exit 1
            fi
            echo "✅ Coverage ${COVERAGE}% meets 80% threshold"
          else
            echo "⚠️  Coverage report not found, skipping threshold check"
          fi

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-coverage
          path: coverage/
          retention-days: 30

      - name: Summary
        if: success()
        run: |
          echo "✅ Unit Tests Passed"
          echo ""
          echo "Validated Laws:"
          echo "- L-TA-002: Coverage thresholds (80%+ overall)"
          echo "- L-CX-001: Settlement accuracy"
          echo "- L-BR-001: Settlement calculation rules"
