name: Visual Regression Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
  NEXTAUTH_SECRET: test-secret-for-ci-vrt
  NEXTAUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  vrt-e2e:
    name: E2E VRT
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup PostgreSQL
        run: |
          brew install postgresql@15
          brew services start postgresql@15
          sleep 3
          /opt/homebrew/opt/postgresql@15/bin/createuser -s postgres || true
          /opt/homebrew/opt/postgresql@15/bin/createdb -U postgres test_db || true
          /opt/homebrew/opt/postgresql@15/bin/psql -U postgres -d test_db -c "CREATE EXTENSION IF NOT EXISTS \"pgcrypto\";"

      - name: Apply database migrations (L-OC-002)
        run: npx drizzle-kit push --verbose
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/test_db

      - name: Create .env.local for VRT tests
        run: |
          echo "DATABASE_URL=postgresql://postgres@localhost:5432/test_db" > .env.local.e2e
          echo "NEXTAUTH_SECRET=${{ env.NEXTAUTH_SECRET }}" >> .env.local.e2e
          echo "NEXTAUTH_URL=${{ env.NEXTAUTH_URL }}" >> .env.local.e2e
          echo "NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}" >> .env.local.e2e
          echo "E2E_TEST=true" >> .env.local.e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run VRT tests
        run: npm run test:vrt
        env:
          CI: true
          DATABASE_URL: postgresql://postgres@localhost:5432/test_db
          NEXTAUTH_SECRET: ${{ env.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ env.NEXTAUTH_URL }}
          NEXT_PUBLIC_APP_URL: ${{ env.NEXT_PUBLIC_APP_URL }}
          E2E_TEST: true

      - name: Upload VRT artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vrt-e2e-snapshots
          path: |
            e2e/vrt/**/*.png
            test-results/**/*.png
          retention-days: 7

  vrt-storybook:
    name: Storybook VRT
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup PostgreSQL
        run: |
          brew install postgresql@15
          brew services start postgresql@15
          sleep 3
          /opt/homebrew/opt/postgresql@15/bin/createuser -s postgres || true
          /opt/homebrew/opt/postgresql@15/bin/createdb -U postgres test_db || true
          /opt/homebrew/opt/postgresql@15/bin/psql -U postgres -d test_db -c "CREATE EXTENSION IF NOT EXISTS \"pgcrypto\";"

      - name: Apply database migrations (L-OC-002)
        run: npx drizzle-kit push --verbose
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/test_db

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Storybook
        run: npm run build-storybook

      - name: Run Storybook VRT
        run: |
          npx concurrently -k -s first -n "SB,TEST" -c "magenta,blue" \
            "npx http-server storybook-static --port 6006 --silent" \
            "npx wait-on tcp:127.0.0.1:6006 && npm run test:storybook:vrt"
        env:
          CI: true
          DATABASE_URL: postgresql://postgres@localhost:5432/test_db
          NEXTAUTH_SECRET: ${{ env.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ env.NEXTAUTH_URL }}
          NEXT_PUBLIC_APP_URL: ${{ env.NEXT_PUBLIC_APP_URL }}

      - name: Upload Storybook VRT artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vrt-storybook-snapshots
          path: .storybook/__snapshots__
          retention-days: 7
