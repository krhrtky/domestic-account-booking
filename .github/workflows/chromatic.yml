name: Visual Regression Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
  NEXTAUTH_SECRET: test-secret-for-ci-vrt
  NEXTAUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  vrt-e2e:
    name: E2E VRT
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations (L-OC-002)
        run: npx drizzle-kit push --verbose
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Create .env.local for VRT tests
        run: |
          echo "DATABASE_URL=$DATABASE_URL" > .env.local.e2e
          echo "NEXTAUTH_SECRET=$NEXTAUTH_SECRET" >> .env.local.e2e
          echo "NEXTAUTH_URL=$NEXTAUTH_URL" >> .env.local.e2e
          echo "NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL" >> .env.local.e2e
          echo "E2E_TEST=true" >> .env.local.e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run VRT tests
        run: npm run test:vrt
        env:
          CI: true
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Upload VRT artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vrt-e2e-snapshots
          path: e2e/vrt/*.png
          retention-days: 7

  vrt-storybook:
    name: Storybook VRT
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations (L-OC-002)
        run: npx drizzle-kit push --verbose
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Storybook
        run: npm run build-storybook

      - name: Run Storybook VRT
        run: |
          npx concurrently -k -s first -n "SB,TEST" -c "magenta,blue" \
            "npx http-server storybook-static --port 6006 --silent" \
            "npx wait-on tcp:127.0.0.1:6006 && npm run test:storybook:vrt"
        env:
          CI: true

      - name: Upload Storybook VRT artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vrt-storybook-snapshots
          path: .storybook/__snapshots__
          retention-days: 7
