name: VRT Snapshot Check

on:
  pull_request:
    branches:
      - master

jobs:
  check-snapshots:
    name: Check VRT Snapshots
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for uncommitted VRT snapshot changes
        run: |
          echo "Checking if VRT snapshots are properly committed..."

          # Check E2E VRT snapshots
          if [ -d "e2e/vrt" ]; then
            E2E_SNAPSHOTS=$(find e2e/vrt -name "*.png" 2>/dev/null | wc -l)
            echo "Found $E2E_SNAPSHOTS E2E VRT snapshot(s)"
          fi

          # Check Storybook VRT snapshots
          if [ -d ".storybook/__snapshots__" ]; then
            SB_SNAPSHOTS=$(find .storybook/__snapshots__ -name "*.png" 2>/dev/null | wc -l)
            echo "Found $SB_SNAPSHOTS Storybook VRT snapshot(s)"
          fi

          # Verify no untracked snapshot files
          UNTRACKED=$(git status --porcelain | grep -E '\.(png)$' | grep '^??' || true)
          if [ -n "$UNTRACKED" ]; then
            echo "::error::Untracked VRT snapshot files found. Please commit them:"
            echo "$UNTRACKED"
            exit 1
          fi

          echo "✓ All VRT snapshots are properly committed"

      - name: Verify snapshot directories exist
        run: |
          # E2E VRT snapshots should exist
          if [ ! -d "e2e/vrt/visual-regression.spec.ts-snapshots" ]; then
            echo "::warning::E2E VRT snapshot directory not found. Run 'npm run test:vrt:update' locally to generate snapshots."
          fi

          echo "✓ Snapshot directory check complete"
