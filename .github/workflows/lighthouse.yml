name: Lighthouse CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
  NEXTAUTH_SECRET: test-secret-for-ci-lighthouse
  NEXTAUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  lighthouse:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env.local for Lighthouse tests
        run: |
          echo "DATABASE_URL=${{ env.DATABASE_URL }}" > .env.local
          echo "NEXTAUTH_SECRET=${{ env.NEXTAUTH_SECRET }}" >> .env.local
          echo "NEXTAUTH_URL=${{ env.NEXTAUTH_URL }}" >> .env.local
          echo "NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}" >> .env.local

      - name: Create pgcrypto extension (for gen_random_uuid)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d test_db -c "CREATE EXTENSION IF NOT EXISTS \"pgcrypto\";"

      - name: Apply database migrations (L-OC-002)
        run: npx drizzle-kit push --verbose
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Verify database schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d test_db -c "\dt"

      - name: Build production bundle
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          NEXTAUTH_SECRET: ${{ env.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
      - name: Create test session
        id: auth
        run: |
          AUTH_COOKIE=$(node scripts/lighthouse-auth.js)
          echo "cookie=$AUTH_COOKIE" >> $GITHUB_OUTPUT
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ env.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ env.NEXTAUTH_URL }}
          NEXT_PUBLIC_APP_URL: ${{ env.NEXT_PUBLIC_APP_URL }}

      - name: Update Lighthouse config with auth cookie
        run: |
          COOKIE="${{ steps.auth.outputs.cookie }}"
          sed -i "s|__LIGHTHOUSE_AUTH_COOKIE__|$COOKIE|g" .lighthouserc.json

      - name: Start production server
        run: |
          npm start &
          echo $! > .server.pid
          npx wait-on http://localhost:3000 -t 30000
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          NEXTAUTH_SECRET: ${{ env.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
      - name: Run Lighthouse CI
        run: npm run lighthouse
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Stop production server
        if: always()
        run: |
          if [ -f .server.pid ]; then
            kill $(cat .server.pid) || true
            rm .server.pid
          fi

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 30
